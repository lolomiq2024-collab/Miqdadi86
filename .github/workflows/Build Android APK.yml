name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK Automatically
      run: |
        # التحقق من وجود مجلد app أو إنشاء بنية أساسية إن لم تكن موجودة
        if [ -d "app" ]; then
          cd app
        fi
        gradle wrapper --gradle-version 8.5 || gradle init --type basic --dsl groovy --test-framework none --incubating
        chmod +x gradlew || true
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore
