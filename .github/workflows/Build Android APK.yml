name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare and Build APK
      run: |
        # البحث عن ملفات المشروع وإنشاء بيئة بناء سليمة إذا لم تكن موجودة
        if [ ! -f "build.gradle" ] && [ ! -f "app/build.gradle" ]; then
          gradle init --type basic --dsl groovy --test-framework none --incubating || true
        fi
        
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "app/gradlew" ]; then
          cd app
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          build/outputs/apk/debug/app-debug.apk
        if-no-files-found: ignore
